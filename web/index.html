    <link rel="preload" href="loader.webp" as="image">

    <!--Loader CSS -->
    <style>
        html,body{height:100%;margin:0;padding:0}
        :root{--loader-bg:#ffffff}
        @media (prefers-color-scheme: dark){:root{--loader-bg:#000000}}
        #loader{
          position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
          background:var(--loader-bg);z-index:99999;transition:opacity 700ms ease,transform 700ms ease;
          -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
        }
        .loader-center{display:flex;align-items:center;justify-content:center}
        #loader-img{
          display:block;width:560px;max-width:70vw;height:auto;border-radius:10px;background:transparent;
          box-shadow:0 8px 28px rgba(0,0,0,0.28);
        }
        .fade-out{opacity:0;transform:translateY(-6px) scale(0.998);pointer-events:none}
    </style>

</head>
<body>
<!--Loader HTML -->
<div id="loader" role="status" aria-hidden="false">
    <div class="loader-center">
        <picture>
            <source srcset="loader.webp" type="image/webp">
            <img id="loader-img" src="loader.webp" alt="">
        </picture>
    </div>
</div>

<script src="flutter_bootstrap.js"></script>

<!-- Fallback Script -->
<script>
    (function(){
    //If The Loader is still on the page after 20 sec then This Script fades it out and removes it
      const LOADER_TIMEOUT_MS = 20000;
      const loader = document.getElementById('loader');
      function removeLoaderImmediate(){
        if(!loader) return;
        loader.classList.add('fade-out');
        setTimeout(()=>{ try{ loader.remove(); }catch(e){} },1500);
      }
      setTimeout(()=>{ if(document.getElementById('loader')) removeLoaderImmediate(); }, LOADER_TIMEOUT_MS);
    })();
</script>

</body>
</html>
